# LLM TeamWork — production compose.
#
# Two services:
#   - app:    the Next.js server (port 3000 internal, no host binding by default)
#   - caddy:  HTTPS reverse proxy with automatic Let's Encrypt cert for $DOMAIN
#
# Configure DOMAIN in .env (or pass via env). Caddy will request and renew the
# TLS cert automatically when port 80/443 are reachable from the public Internet.
# DNS for $DOMAIN must point to this host.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-teamwork:latest
    container_name: llm-teamwork
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - data:/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: llm-teamwork-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-tm.9swt.com}
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
