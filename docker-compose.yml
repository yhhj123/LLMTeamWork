# LLM TeamWork — production compose.
#
# Single-service stack. The app binds to 127.0.0.1:3001 on the host so a
# host-level reverse proxy (nginx, Caddy, Traefik...) can terminate TLS and
# forward to it. See deploy/README.md for how to wire up nginx with a
# tm.9swt.com vhost.
#
# Why localhost-only? Most production hosts already run nginx and you don't
# want our container exposed to the public Internet directly. Binding to
# 127.0.0.1 keeps it strictly internal.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-teamwork:latest
    container_name: llm-teamwork
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3001}:3000"
    volumes:
      - data:/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
