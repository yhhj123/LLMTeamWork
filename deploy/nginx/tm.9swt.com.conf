# LLM TeamWork — nginx vhost for tm.9swt.com.
#
# Drop this file into /etc/nginx/conf.d/ on the host that already runs nginx,
# adjust the SSL cert paths if needed, then `nginx -t && systemctl reload nginx`.
#
# The upstream points at 127.0.0.1:3001, which is where our docker-compose
# binds the LLM TeamWork app (see docker-compose.yml -> APP_HOST_PORT).

upstream llm_teamwork_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS redirect, plus ACME http-01 path passthrough so certbot can
# renew without disrupting traffic.
server {
    listen 80;
    listen [::]:80;
    server_name tm.9swt.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tm.9swt.com;

    # === TLS =================================================================
    # Adjust to whichever cert you have on this box. Two common cases:
    #
    # (A) Existing *.9swt.com wildcard cert managed elsewhere:
    #       ssl_certificate     /etc/nginx/ssl/9swt.com/fullchain.pem;
    #       ssl_certificate_key /etc/nginx/ssl/9swt.com/privkey.pem;
    #
    # (B) Fresh per-host Let's Encrypt cert via certbot:
    #       certbot certonly --webroot -w /var/www/letsencrypt -d tm.9swt.com
    #     gives:
    #       ssl_certificate     /etc/letsencrypt/live/tm.9swt.com/fullchain.pem;
    #       ssl_certificate_key /etc/letsencrypt/live/tm.9swt.com/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/tm.9swt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tm.9swt.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_TM:10m;
    ssl_session_timeout 1d;

    # === Limits ==============================================================
    # Matches the app-side 25 MB attachment cap with a small cushion.
    client_max_body_size 30m;
    proxy_read_timeout   60s;
    proxy_send_timeout   60s;

    # === Reverse proxy =======================================================
    location / {
        proxy_pass http://llm_teamwork_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / SSE-friendly (room for future use)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $http_connection;
    }

    # MCP endpoint: never cache, allow long bodies
    location /api/mcp {
        proxy_pass http://llm_teamwork_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        add_header Cache-Control "no-store" always;
    }

    access_log /var/log/nginx/tm.9swt.com.access.log;
    error_log  /var/log/nginx/tm.9swt.com.error.log warn;
}
